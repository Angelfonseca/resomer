[package]
name = "resomer-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.11", features = ["multipart", "json"] }
cpal = "0.18"
hound = "3.5"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
keyring = "2.1"
rusqlite = { version = "0.30", features = ["bundled", "chrono", "uuid"] }
tauri-plugin-store = "2"
sherpa-onnx = { version = "1.13.4", default-features = false, features = ["static"] }

[profile.release]
opt-level = 3
lto = true
strip = true

[build-dependencies]
tauri-build = { version = "2", features = ["config-json5"] }

[dev-dependencies]
mockall = "0.12"
