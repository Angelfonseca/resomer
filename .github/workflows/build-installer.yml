name: Build installer (DMG)

# Resomer usa ScreenCaptureKit + un helper Swift compilado en build.rs, así
# que sólo puede compilarse en macOS. Cada arquitectura se construye en un
# runner nativo (no cross-compile) porque swiftc no recibe -target en build.rs.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14 # Apple Silicon
            target: aarch64-apple-darwin
          - runner: macos-13 # Intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: pnpm install --frozen-lockfile

      - name: Descargar modelos ONNX
        run: ./scripts/setup-models.sh

      # Falla si Cargo.lock está desactualizado, en vez de reescribirlo en CI.
      - run: cargo fetch --locked

      - name: Build DMG
        run: pnpm tauri build --target ${{ matrix.target }} --bundles dmg
        env:
          # Firma ad-hoc por defecto (no requiere secretos). Para builds
          # notarizados con una cuenta de Apple Developer real, define los
          # secretos APPLE_SIGNING_IDENTITY/APPLE_CERTIFICATE/etc. en el repo.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: resomer-dmg-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
